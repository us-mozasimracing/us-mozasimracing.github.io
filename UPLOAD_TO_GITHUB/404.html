<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | MOZA Racing</title>
  <link rel="shortcut icon" href="https://us.mozaracing.com/cdn/shop/files/MOZA-RACING-Site-Identity.webp?crop=center&height=32&v=1751278490&width=32" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function() {
      var path = window.location.pathname;
      var clean = path.replace(/\/+$/, "");
      var segment = clean.split("/").pop();

      // If user typed /products/cs-pro-wheel, redirect to cs-pro-wheel.html
      var knownProducts = [
        "cs-pro-wheel",
        "r21-ultra",
        "r16-ultra",
        "r12-wheelbase",
        "crp2-pedals",
        "srp2-pedals",
        "mbooster-active-pedal",
        "ford-gtd-wheel"
      ];

      for (var i = 0; i < knownProducts.length; i++) {
        if (segment === knownProducts[i]) {
          var target = window.location.href.replace(new RegExp("/products/" + segment + "(/)?"), "/" + segment + ".html");
          if (target !== window.location.href) {
            window.location.replace(target);
            return;
          }
        }
      }
    })();
  </script>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen flex flex-col justify-between font-sans">
  <header class="border-b border-neutral-800 px-6 py-4 flex items-center justify-between">
    <a href="index.html">
      <img src="https://us.mozaracing.com/cdn/shop/files/MOZA_Racing_White.svg?v=1751278730&width=317" alt="MOZA Racing Logo" class="h-6 w-auto">
    </a>
    <a href="index.html" class="text-xs uppercase tracking-wider font-bold text-[#C9AF89] hover:underline">
      Store Home &rarr;
    </a>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-20 text-center">
    <span class="inline-block px-3 py-1 bg-red-950/60 border border-red-500/30 text-red-400 text-xs font-mono rounded-full mb-6">404 • Page Not Found</span>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-4">You've Gone Off Track</h1>
    <p class="text-gray-400 text-base sm:text-lg mb-8">The page or product configuration you are looking for does not exist or may have been moved.</p>
    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="index.html" class="px-6 py-3 rounded-full bg-[#C9AF89] hover:bg-[#b59a72] text-black font-bold text-sm transition-all shadow-lg hover:scale-105">
        Return to Storefront
      </a>
      <a href="cs-pro-wheel.html" class="px-6 py-3 rounded-full border border-neutral-700 hover:border-white text-white font-semibold text-sm transition-all">
        View CS Pro Wheel
      </a>
      <a href="r21-ultra.html" class="px-6 py-3 rounded-full border border-neutral-700 hover:border-white text-white font-semibold text-sm transition-all">
        View R21 Ultra Base
      </a>
    </div>
  </main>

  <footer class="border-t border-neutral-900 py-6 text-center text-xs text-gray-600">
    &copy; 2026 MOZA Racing. All rights reserved.
  </footer>
</body>
</html>
